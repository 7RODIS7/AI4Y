<svg width="500" height="500" viewBox="0 0 500 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circles -->
  <circle cx="250" cy="250" r="200" fill="url(#grad1)" opacity="0.1"/>
  <circle cx="250" cy="250" r="150" fill="url(#grad2)" opacity="0.15"/>
  
  <!-- Brain illustration -->
  <path d="M250 100C194.772 100 150 144.772 150 200V250C150 305.228 194.772 350 250 350C305.228 350 350 305.228 350 250V200C350 144.772 305.228 100 250 100Z" 
        stroke="url(#grad3)" stroke-width="4" fill="none"/>
  
  <!-- Circuit paths -->
  <path d="M200 200 L240 240 M260 240 L300 200" stroke="url(#grad4)" stroke-width="3" stroke-linecap="round"/>
  <path d="M200 280 L240 280 M260 280 L300 280" stroke="url(#grad4)" stroke-width="3" stroke-linecap="round"/>
  <path d="M220 250 L280 250" stroke="url(#grad4)" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Nodes -->
  <circle cx="200" cy="200" r="8" fill="#667eea"/>
  <circle cx="300" cy="200" r="8" fill="#764ba2"/>
  <circle cx="200" cy="280" r="8" fill="#f093fb"/>
  <circle cx="300" cy="280" r="8" fill="#667eea"/>
  <circle cx="250" cy="250" r="12" fill="#764ba2"/>
  
  <!-- Animated dots -->
  <circle cx="220" cy="220" r="4" fill="#fff" opacity="0.8">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="280" cy="220" r="4" fill="#fff" opacity="0.8">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="250" cy="265" r="4" fill="#fff" opacity="0.8">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Gradients -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#764ba2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f093fb;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#764ba2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f093fb;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#fff;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#fff;stop-opacity:0.4" />
    </linearGradient>
  </defs>
</svg>

